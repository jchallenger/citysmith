[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citysmith"
version = "0.1.0"
description = "Generate a city, find a location worth playing in, and build it as a TaleSpire map."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
# The generator is fully usable offline. Claude only translates natural
# language into generator parameters and writes GM-facing prose.
ai = ["anthropic>=0.40"]
# `pytest-xdist` is a test-runner plugin, not a dependency of the generator:
# the stdlib-only rule is scoped to the core, and nothing under `citysmith/`
# imports either of these. It takes the suite from 104s to 24s on 16 cores.
dev = ["pytest>=8", "pytest-xdist>=3"]

[project.scripts]
citysmith = "citysmith.cli:main"

[tool.setuptools.packages.find]
include = ["citysmith*"]

# The build UI is hand-written HTML/CSS/JS -- there is no bundler and no
# build step, so the files ship as they are written.
[tool.setuptools.package-data]
"citysmith.ui" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
